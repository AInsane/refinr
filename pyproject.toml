[project]
name = "refinr"
version = "0.1.0"
description = "Find the parts of a corpus that are not earning their place. Runs fully local."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
refinr = "refinr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
